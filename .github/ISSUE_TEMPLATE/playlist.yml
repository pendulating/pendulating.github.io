name: "🎵 New Playlist"
description: "Add a new playlist to your brain"
title: "[PLAYLIST] "
labels: ["playlist"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "Describe the playlist (the issue title above becomes your playlist name)"
      placeholder: |
        🎵 The issue title above becomes your playlist name
        
        What's the mood? When do you listen to this?
        What's the story behind these songs?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: "Platform"
      options:
        - spotify
        - apple
    validations:
      required: true

  - type: input
    id: playlist_url
    attributes:
      label: "Playlist URL"
      description: "Link to the playlist (must be a valid URL)"
      placeholder: "https://open.spotify.com/playlist/..."
    validations:
      required: true

  - type: input
    id: mood
    attributes:
      label: "Mood (optional)"
      description: "Comma-separated moods or genres"
      placeholder: "chill, indie, study, road-trip"
