name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Add concurrency to cancel in-progress jobs
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          # Match pnpm-lock.yaml (lockfileVersion 9.0) and local pnpm.
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 10 requires Node >= 18.12; 22 is current LTS.
          node-version: 22
          cache: 'pnpm'
      - name: Install, build, and upload your site
        uses: withastro/action@v2
        with:
          node-version: 22
          # Pin (was pnpm@latest, which floated to pnpm 11 and broke
          # on Node 20 via the missing node:sqlite builtin).
          package-manager: pnpm@10

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4