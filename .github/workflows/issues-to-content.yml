name: Convert Issues to Content

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write
  pages: write

jobs:
  convert-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Issue Event
        run: |
          echo "Issue labels: ${{ toJson(github.event.issue.labels) }}"
          echo "Issue title: ${{ github.event.issue.title }}"
          echo "Event action: ${{ github.event.action }}"
          
      - name: Check if content issue
        id: check
        run: |
          labels='${{ toJson(github.event.issue.labels.*.name) }}'
          echo "Labels array: $labels"
          
          if echo "$labels" | grep -q '"snip"'; then
            echo "is_content=true" >> $GITHUB_OUTPUT
            echo "content_type=snips" >> $GITHUB_OUTPUT
          elif echo "$labels" | grep -q '"playlist"'; then
            echo "is_content=true" >> $GITHUB_OUTPUT
            echo "content_type=playlists" >> $GITHUB_OUTPUT
          elif echo "$labels" | grep -q '"album"'; then
            echo "is_content=true" >> $GITHUB_OUTPUT
            echo "content_type=albums" >> $GITHUB_OUTPUT
          else
            echo "is_content=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check.outputs.is_content == 'true'
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Issue to Content
        if: steps.check.outputs.is_content == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            // Helpers
            const stripHtmlComments = (text) => String(text)
              .replace(/^<!--[\s\S]*?-->\s*/,'')
              .replace(/<!--[\s\S]*?-->/g,'');
            const isPlaceholder = (value) => {
              if (value === null || value === undefined) return true;
              const trimmed = String(value).trim();
              if (trimmed.length === 0 || /^_?no response_?$/i.test(trimmed)) return true;
              if (trimmed.includes('The issue title above becomes your')) return true;
              return false;
            };
            const summarize = (text, maxLen = 160) => {
              if (!text) return '';
              const lines = String(text).split('\n').map(l => l.trim()).filter(Boolean);
              if (lines.length === 0) return '';
              const joined = lines.join(' ');
              return joined.length > maxLen ? `${joined.slice(0, maxLen).trim()}…` : joined;
            };

            const getSection = (body, sectionName) => {
              const regex = new RegExp(`^###\\s*${sectionName}(?:[^\\n]*)\\n+([\\s\\S]*?)(?:\\n+###\\s|$)`, 'im');
              const match = body.match(regex);
              if (match && match[1]) {
                const content = match[1].trim();
                return isPlaceholder(content) ? '' : content;
              }
              return '';
            };

            const parseTags = (text) => {
              if (!text) return [];
              const input = stripHtmlComments(String(text));
              const tags = [];
              const re = /"([^"\n]+)"|'([^'\n]+)'|([^,\n;]+)/g;
              let m;
              while ((m = re.exec(input)) !== null) {
                const raw = (m[1] ?? m[2] ?? m[3] ?? '').trim();
                if (!raw) continue;
                let t = raw.replace(/^[*-]\s+/, '').trim();
                t = t.replace(/^#\s*/, '').trim();
                if (!t || isPlaceholder(t)) continue;
                tags.push(t);
              }
              return Array.from(new Set(tags));
            };
            
            // Get issue details
            const issue = context.payload.issue;
            let title = issue.title;
            const body = issue.body || '';
            title = title.replace(/^\[.*?\]\s*/, '').trim();
            const contentType = '${{ steps.check.outputs.content_type }}';
            
            let extractedContent = '';
            let extractedTags = [];
            let extractedDescription = '';
            let extractedUrl = '';
            let extractedPlatform = 'spotify';
            let extractedMood = [];
            let extractedLocation = '';
            let extractedSource = '';
            let extractedCameraInfo = '';
            let extractedDateRange = '';
            
            if (contentType === 'snips') {
              extractedContent = getSection(body, 'Content');
              extractedSource = getSection(body, 'Source (optional)');
              extractedTags = parseTags(getSection(body, 'Tags (optional)'));
              extractedDescription = summarize(extractedContent, 160) || title;
            } else if (contentType === 'playlists') {
              extractedDescription = getSection(body, 'Description');
              extractedPlatform = (getSection(body, 'Platform') || 'spotify').toLowerCase();
              extractedUrl = getSection(body, 'Playlist URL');
              extractedMood = parseTags(getSection(body, 'Mood (optional)'));
              extractedTags = extractedMood;
              extractedContent = (extractedDescription.length > 50) ? extractedDescription : '';
            } else if (contentType === 'albums') {
              extractedDescription = getSection(body, 'Description & Photos');
              extractedLocation = getSection(body, 'Location (optional)');
              extractedDateRange = getSection(body, 'Date/Period (optional)');
              extractedCameraInfo = getSection(body, 'Camera/Equipment (optional)');
              extractedTags = parseTags(getSection(body, 'Tags (optional)'));
              
              const cleanDescription = extractedDescription.replace(/!\[.*?\]\(.*?\)/g, '').trim();
              extractedDescription = summarize(cleanDescription, 160) || title;
              extractedContent = getSection(body, 'Description & Photos');
            }
            
            const slug = title.toLowerCase().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').trim();
            const now = new Date().toISOString();
            
            let frontmatter = `---\ntitle: "${title.replace(/"/g, '\\"')}"\npubDatetime: "${now}"\nfeatured: false\ndraft: false\n`;

            if (contentType === 'snips') {
              frontmatter += `description: "${extractedDescription.replace(/"/g, '\\"')}"\n`;
              if (extractedSource) frontmatter += `source: "${extractedSource.replace(/"/g, '\\"')}"\n`;
              frontmatter += `sourceUrl: "${issue.html_url}"\n`;
              frontmatter += `tags: [${extractedTags.map(t => `"${t.replace(/"/g, '\\"')}"`).join(', ')}]\n`;
            } else if (contentType === 'playlists') {
              frontmatter += `description: "${extractedDescription.replace(/"/g, '\\"')}"\n`;
              frontmatter += `platform: "${extractedPlatform}"\n`;
              frontmatter += `playlistUrl: "${extractedUrl}"\n`;
              if (extractedMood.length > 0) frontmatter += `mood: [${extractedMood.map(m => `"${m.replace(/"/g, '\\"')}"`).join(', ')}]\n`;
              frontmatter += `tags: [${extractedTags.map(t => `"${t.replace(/"/g, '\\"')}"`).join(', ')}]\n`;
            } else if (contentType === 'albums') {
              frontmatter += `description: "${extractedDescription.replace(/"/g, '\\"')}"\n`;
              if (extractedLocation) frontmatter += `location: "${extractedLocation.replace(/"/g, '\\"')}"\n`;
              frontmatter += `tags: [${extractedTags.map(t => `"${t.replace(/"/g, '\\"')}"`).join(', ')}]\n`;
              frontmatter += `borderColor: "#ffffff"\n`;
            }
            
            frontmatter += `---\n\n${extractedContent}`;
            
            let filePath;
            if (contentType === 'albums') {
              const albumFileName = `${slug}.md`;
              filePath = `src/content/albums/${albumFileName}`;
              fs.mkdirSync('src/content/albums', {recursive: true});
              
              const albumDir = `src/content/photos/${slug}`;
              fs.mkdirSync(albumDir, {recursive: true});
              
              const imageRegex = /!\[.*?\]\((https:\/\/github\.com\/.*?\/assets\/.*?|https:\/\/github\.com\/user-attachments\/assets\/.*?)\)/g;
              const imageMatches = [...body.matchAll(imageRegex)];
              
              if (imageMatches.length > 0) {
                console.log(`Found ${imageMatches.length} image(s) in issue`);
                
                for (let i = 0; i < imageMatches.length; i++) {
                  const imageUrl = imageMatches[i][1];
                  
                  try {
                    // Use curl to get the binary file. This is more robust in GitHub Actions than fetch.
                    // -L follows redirects, -s is silent, -I gets headers.
                    const headers = execSync(`curl -sLI "${imageUrl}"`).toString();
                    const contentTypeMatch = headers.match(/content-type:\s*image\/(\w+)/i);
                    let imageExt = contentTypeMatch ? contentTypeMatch[1].toLowerCase() : 'jpg';
                    if (imageExt === 'jpeg') imageExt = 'jpg';
                    
                    const imageName = `${slug}-${i + 1}.${imageExt}`;
                    const imagePath = `${albumDir}/${imageName}`;
                    
                    console.log(`Downloading: ${imageUrl} to ${imagePath}`);
                    execSync(`curl -skL "${imageUrl}" -o "${imagePath}"`);
                    
                    let photoFrontmatter = `---\nalbumId: "${slug}"\ntitle: "${title.replace(/"/g, '\\"')} - Photo ${i + 1}"\nphoto: "./${imageName}"\ncaption: ""\norder: ${i + 1}\npubDatetime: "${now}"\n`;
                    
                    if (extractedCameraInfo || extractedLocation) {
                      photoFrontmatter += `metadata:\n`;
                      if (extractedCameraInfo) photoFrontmatter += `  camera: "${extractedCameraInfo.replace(/"/g, '\\"')}"\n`;
                      if (extractedLocation) photoFrontmatter += `  location: "${extractedLocation.replace(/"/g, '\\"')}"\n`;
                    }
                    
                    const finalPhotoMarkdown = photoFrontmatter + `---\n\n`;
                    const photoMarkdownPath = `${albumDir}/${slug}-${i + 1}.md`;
                    fs.writeFileSync(photoMarkdownPath, finalPhotoMarkdown);
                    
                    console.log(`Saved: ${imageName} and metadata`);
                  } catch (error) {
                    console.error(`Failed to process image ${imageUrl}:`, error);
                  }
                }
              }
            } else {
              filePath = `src/content/${contentType}/${slug}.md`;
              fs.mkdirSync(path.dirname(filePath), {recursive: true});
            }
            
            fs.writeFileSync(filePath, frontmatter);
            
            execSync('git config user.name "GitHub Action"');
            execSync('git config user.email "action@github.com"');
            
            // Prepare safe title for shell commands
            const safeTitle = title.replace(/"/g, '\\"');
            
            if (contentType === 'albums') {
              execSync(`git add "src/content/albums/${slug}.md"`);
              execSync(`git add "src/content/photos/${slug}/"`);
              execSync(`git commit -m "Add album: ${safeTitle} (from issue #${issue.number})"`);
            } else {
              execSync(`git add "${filePath}"`);
              execSync(`git commit -m "Add ${contentType.slice(0, -1)}: ${safeTitle} (from issue #${issue.number})"`);
            }
            
            execSync('git push');
             
             console.log('Triggering site rebuild...');
             await github.rest.actions.createWorkflowDispatch({
               owner: context.repo.owner,
               repo: context.repo.repo,
               workflow_id: 'deploy.yml',
               ref: 'main'
             }).catch(async (error) => {
               console.warn('Failed to trigger deploy.yml, trying pages-build-deployment...');
               try {
                 await github.rest.pages.requestPagesBuild({
                   owner: context.repo.owner,
                   repo: context.repo.repo
                 });
                 console.log('Triggered Pages rebuild successfully');
               } catch (pagesError) {
                 console.error('Failed to trigger Pages rebuild:', pagesError);
               }
             });
             
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed'
            });
            
            const itemType = contentType === 'albums' ? 'album' : contentType.slice(0, -1);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `✅ Created ${itemType}: \`${filePath}\``
            }); 
